specVersion: "4.0"
metadata:
  name: siagrob1
type: application
framework:
  name: SAPUI5
  version: "1.141.0"
  # Precisa da mesma lista do ui5.yaml: os testes OPA sobem o componente de
  # verdade, e a view raiz usa sap.tnt/sap.f. Com a lista reduzida o
  # ToolPage não carrega e a jornada falha.
  libraries:
    - name: sap.f
    - name: sap.m
    - name: sap.tnt
    - name: sap.ui.comp
    - name: sap.ui.core
    - name: sap.ui.export
    - name: sap.ui.fl
    - name: sap.ui.layout
    - name: sap.ui.table
    - name: sap.uxap
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - "test/e2e/**"
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        debug: true
        babelConfig:
          sourceMaps: true
          ignore:
          - "**/*.d.ts"
          presets:
          - - "@babel/preset-env"
            - targets: defaults
          - - transform-ui5
          - "@babel/preset-typescript"
          plugins:
          - istanbul
    - name: ui5-middleware-livereload
      afterMiddleware: compression
