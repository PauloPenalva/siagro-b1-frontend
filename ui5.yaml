specVersion: "4.0"
metadata:
  name: siagrob1
type: application
framework:
  name: SAPUI5
  version: "1.141.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.table
    - name: sap.tnt
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.ui.fl
    - name: sap.ui.comp
    - name: sap.uxap
    - name: sap.ui.export
    - name: themelib_sap_horizon
    - name: themelib_sap_fiori_3
    - name: themelib_sap_bluecrystal
builder:
  resources:
    excludes:
      - "test/e2e/**"
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
    - name: ui5-task-cachebuster-indexing
      afterTask: generateCachebusterInfo
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    - name: ui5-middleware-livereload
      afterMiddleware: compression
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /odata
      configuration:
        baseUri: "http://localhost:5246/odata"
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /security
      configuration:
        baseUri: "http://localhost:5246/security"
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /reports
      configuration:
        baseUri: "http://localhost:5246/reports"
    # /scales carrega Server-Sent Events (peso ao vivo). O simpleproxy acumula a resposta inteira
    # antes de devolvê-la, e como o SSE nunca termina o navegador ficava sem nenhuma leitura.
    - name: scales-sse-proxy
      afterMiddleware: compression
      mountPath: /scales
      configuration:
        baseUri: "http://localhost:5246/scales"
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /hangfire
      configuration:
        baseUri: "http://localhost:5246/hangfire"
---
specVersion: "4.0"
kind: extension
type: server-middleware
metadata:
  name: scales-sse-proxy
middleware:
  path: lib/middleware/scalesSseProxy.js
