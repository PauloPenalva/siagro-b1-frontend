specVersion: "4.0"
metadata:
  name: siagrob1
type: application
framework:
  name: SAPUI5
  version: "1.141.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.table
    - name: sap.tnt
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.ui.fl
    - name: sap.ui.comp
    - name: sap.uxap
    - name: sap.ui.export
    - name: themelib_sap_horizon
    - name: themelib_sap_fiori_3
    - name: themelib_sap_bluecrystal
builder:
  resources:
    excludes:
      # A pasta test/ só serve ao dev server (o `yarn test` roda sobre webapp/, via
      # ui5-coverage.yaml). O dist/ inteiro é copiado para o wwwroot do Gateway,
      # então nada de teste precisa ir junto.
      - "test/**"
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        # O dist/ inteiro é publicado no wwwroot do Gateway. Os .js.map (12 MB) e os .ts
        # que eles referenciam (2,2 MB) não são usados pela aplicação em execução — só
        # pelo DevTools aberto — e deixavam o fonte TypeScript exposto publicamente.
        # Para depurar um build, gere um dist local sem estas duas opções.
        omitSourceMaps: true
        omitTSFromBuildResult: true
    - name: ui5-task-cachebuster-indexing
      afterTask: generateCachebusterInfo
    # O cachebuster clona cada recurso para ~<timestamp>~/... e o clone perde as tags do
    # original, trazendo os .ts de volta ao dist/. Tem que rodar depois dele.
    - name: omit-typescript-sources
      afterTask: ui5-task-cachebuster-indexing
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    - name: ui5-middleware-livereload
      afterMiddleware: compression
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /odata
      configuration:
        baseUri: "http://localhost:5246/odata"
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /security
      configuration:
        baseUri: "http://localhost:5246/security"
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /reports
      configuration:
        baseUri: "http://localhost:5246/reports"
    # /scales carrega Server-Sent Events (peso ao vivo). O simpleproxy acumula a resposta inteira
    # antes de devolvê-la, e como o SSE nunca termina o navegador ficava sem nenhuma leitura.
    - name: scales-sse-proxy
      afterMiddleware: compression
      mountPath: /scales
      configuration:
        baseUri: "http://localhost:5246/scales"
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /hangfire
      configuration:
        baseUri: "http://localhost:5246/hangfire"
---
specVersion: "4.0"
kind: extension
type: server-middleware
metadata:
  name: scales-sse-proxy
middleware:
  path: lib/middleware/scalesSseProxy.js
---
specVersion: "4.0"
kind: extension
type: task
metadata:
  name: omit-typescript-sources
task:
  path: lib/tasks/omitTypeScriptSources.js
